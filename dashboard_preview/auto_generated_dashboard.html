<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Generated Dashboard | Luxury Gold</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        :root {
            --primary: #E8B860;
            --light: #F7D794;
            --dark: #B88A2C;
            --glow: rgba(232, 184, 96, 0.15);
            --bg-main: #262320;
            --bg-card: #2E2B28;
            --bg-sidebar: #221F1D;
            --text-main: #F0D9A9;
            --text-muted: #C2B59C;
        }
        body {
            background: linear-gradient(135deg, #1a1816 0%, #262320 100%);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: start;
        }
        .dashboard-window {
            width: 100%;
            max-width: 1600px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 35px 80px rgba(0,0,0,0.6);
            background: #262320;
            display: flex;
            position: relative;
            border: 1px solid rgba(232, 184, 96, 0.15);
        }
        .sidebar {
            width: 90px;
            background: var(--bg-sidebar);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border-right: 1px solid rgba(232, 184, 96, 0.15);
        }
        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            margin-bottom: 30px;
            box-shadow: 0 0 20px var(--glow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-sidebar);
            font-weight: bold;
        }
        .nav-item {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(232, 184, 96, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            padding: 10px;
        }
        .nav-item svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active {
            background: var(--primary);
            color: var(--bg-sidebar);
            box-shadow: 0 0 15px var(--glow);
            border-color: var(--light);
        }
        .nav-item.active svg { stroke: var(--bg-sidebar); }
        .nav-item:hover { background: var(--glow); color: var(--primary); }
        .main-content {
            flex: 1;
            padding: 25px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 22px;
            color: var(--light);
            font-weight: 600;
        }
        .top-bar-icons { display: flex; gap: 15px; align-items: center; }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--glow); border: 1px solid rgba(232, 184, 96, 0.15);
            color: var(--primary); display: flex; align-items: center;
            justify-content: center; cursor: pointer;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 18px;
        }
        .card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid rgba(232, 184, 96, 0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute; top:0; left:0; right:0; height:1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity:0.3;
        }
        .kpi-card::before { height: 3px; opacity: 0.8; }
        .kpi-label {
            font-size: 13px; color: var(--text-muted); margin-bottom:8px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .kpi-value {
            font-size: 32px; font-weight: 700; color: var(--primary); margin-bottom: 8px;
        }
        .kpi-growth { font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .growth-positive { color: #22C55E; }
        .growth-negative { color: #EF4444; }
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap:18px;
            margin-bottom: 18px;
        }
        .chart-title {
            font-size: 16px; font-weight: 600; margin-bottom: 15px;
            color: var(--light);
        }
        .chart-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }
        .data-table { width:100%; border-collapse: collapse; margin-top: 10px; }
        .data-table th {
            text-align: left; padding:10px 8px; font-size:11px; color: var(--primary);
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(232, 184, 96, 0.15);
        }
        .data-table td {
            padding:12px 8px; font-size:12px; color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        canvas { max-width: 100%; }
    </style>
</head>
